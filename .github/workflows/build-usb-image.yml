name: Build Debian USB Image

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Debian 版本'
        required: true
        default: 'bookworm'
        type: choice
        options: [bookworm, trixie]
      img_size_mb:
        description: '镜像总大小 (MiB), 写进 U 盘后可运行 usb-grow.sh 扩展到整盘'
        required: true
        default: '8192'
        type: string
      root_size_mb:
        description: '根分区大小 (MiB)'
        required: true
        default: '6144'
        type: string
      with_bios_grub:
        description: '同时安装传统 BIOS 的 GRUB (实验性, 多数现代机器不需要)'
        required: true
        default: '0'
        type: choice
        options: ['0', '1']
      with_projects:
        description: '预装两个 Python 下载器项目 + Playwright Chromium'
        required: true
        default: '1'
        type: choice
        options: ['1', '0']
      profile:
        description: '镜像档位 | slim = 纯命令行(不装 PyQt6/Chromium/Noto CJK, 省约 1.3GB)'
        required: true
        default: 'full'
        type: choice
        options: ['full', 'slim']
      apt_mirror:
        description: '镜像里的 apt 源 | 填 off = 保持官方源'
        required: true
        default: 'https://mirrors.tuna.tsinghua.edu.cn/debian'
        type: string
      pip_index:
        description: '镜像里的 pip 源 | 填 off = 用默认 PyPI'
        required: true
        default: 'https://pypi.tuna.tsinghua.edu.cn/simple'
        type: string
      proxy_url:
        description: '预置代理(只是写好配置, 不会强制打开; 端口通不通会自动探测)'
        required: true
        default: 'socks5://192.168.6.1:1070'
        type: string
  push:
    tags:
      - 'v*'
  workflow_call:

permissions:
  contents: write        # 打 tag 触发时要把产物发到 Release
  actions: write          # 用来主动取消同一分支上更早的构建(见下面的步骤)

# 并发组必须按 run 唯一, 不能按分支。
#
# 踩过的坑: 原来用 group: usb-image-${{ github.ref }} + cancel-in-progress: true,
# 想着"新构建自动把旧的取消掉"。但 GitHub 的并发槽位是**到 run 进入终态才释放**的,
# 而被取消的 run 偶尔会卡在 in_progress 永远不落定(job 已经是 cancelled, 但
# run 状态不更新, 连 cancel 接口都返回 409 "not in progress")。
# 那个僵尸 run 就一直占着 usb-image-refs/heads/main 这个槽位,
# 后面所有新构建全部卡在 queued, 一个都跑不起来。
#
# 现在改成每个 run 一个独立的组, 互相不可能阻塞; "取消更早的构建"改成显式步骤做。
concurrency:
  group: usb-image-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 U 盘镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUITE: ${{ github.event.inputs.suite || 'bookworm' }}
      IMG_SIZE_MB: ${{ github.event.inputs.img_size_mb || '8192' }}
      ROOT_SIZE_MB: ${{ github.event.inputs.root_size_mb || '6144' }}
      WITH_BIOS_GRUB: ${{ github.event.inputs.with_bios_grub || '0' }}
      WITH_PROJECTS: ${{ github.event.inputs.with_projects || '1' }}
      PROFILE: ${{ github.event.inputs.profile || 'full' }}
      APT_MIRROR: ${{ github.event.inputs.apt_mirror }}
      PIP_INDEX_URL: ${{ github.event.inputs.pip_index }}
      PROXY_URL_DEFAULT: ${{ github.event.inputs.proxy_url }}

    steps:
      - name: 取消同一分支上更早的构建
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 以前靠 concurrency: cancel-in-progress 自动取消, 现在并发组按 run 唯一,
          # 这里显式做同样的事: 同一分支上只留最新的一次构建在跑。
          # 取消失败(zombie run)不影响本次构建, 一律忽略。
          gh run list --repo "${{ github.repository }}" --workflow build-usb-image.yml \
            --status in_progress --json databaseId --jq '.[].databaseId' |
          while read -r id; do
            if [ "$id" != "${{ github.run_id }}" ]; then
              echo "取消更早的构建 $id"
              gh run cancel "$id" --repo "${{ github.repository }}" || true
            fi
          done

      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 拉全历史: lint-helpers 的自测要用历史上真正炸掉过的那份 build-image.sh
          # 做回归用例。浅克隆拿不到, 那条用例会跳过。
          fetch-depth: 0

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap e2fsprogs dosfstools mtools gdisk parted util-linux \
            rsync xz-utils ca-certificates gnupg git \
            grub-pc-bin grub-common \
            qemu-system-x86 ovmf shellcheck

      - name: Shell 语法检查
        run: |
          shellcheck -S warning scripts/*.sh overlay/usr/local/bin/* || true
          # bash -n / shellcheck 都查不出"调用了没定义的函数"。
          # 之前就因为 build-image.sh 里写了 `ok "..."` 而漏定义 ok(),
          # 一路跑到第 4/9 步才 "ok: command not found"(exit 127),
          # 白白浪费一整次 20 分钟的构建。这步是阻塞的: 有问题几秒内就失败。
          for f in scripts/*.sh overlay/usr/local/bin/* overlay-n1/usr/local/bin/*; do
            bash -n "$f" || { echo "语法错误: $f"; exit 1; }
          done
          bash scripts/lint-helpers.sh

      - name: lint-helpers 自测
        run: bash scripts/test-lint-helpers.sh

      - name: music 命令行回归测试
        run: bash scripts/test-music-cli.sh

      - name: 快捷键清理脚本回归测试
        run: bash scripts/test-keyboard-shortcuts.sh

      - name: wifi 命令回归测试
        run: bash scripts/test-wifi-cli.sh

      - name: 音乐工具绕开环境代理回归测试
        run: bash scripts/test-music-proxy.sh

      - name: 播放器 music play 接线回归测试
        run: bash scripts/test-music-play.sh

      - name: 局域网诊断 netkit 回归测试
        run: bash scripts/test-net-kit.sh

      - name: 火车票查询 train 回归测试
        run: bash scripts/test-train.sh

      - name: 旅游攻略 travel-planner 技能回归测试
        run: bash scripts/test-travel-skill.sh

      - name: draw.io MCP 服务回归测试
        run: bash scripts/test-drawio-mcp.sh

      - name: 构建镜像
        run: |
          # 构建日志同时落一份到 build-image.log: 构建失败时作为 artifact 上传,
          # 免得只能靠人去网页上翻日志(日志接口要 admin 权限才拉得到)。
          # pipefail 必须显式开: 默认 bash 只看管道最后一个命令(tee)的退出码,
          # 那样构建挂了这一步还会显示成功。
          set -o pipefail
          sudo -E env \
            SUITE="$SUITE" \
            IMG_SIZE_MB="$IMG_SIZE_MB" \
            ROOT_SIZE_MB="$ROOT_SIZE_MB" \
            WITH_BIOS_GRUB="$WITH_BIOS_GRUB" \
            WITH_PROJECTS="$WITH_PROJECTS" \
            PROFILE="$PROFILE" \
            APT_MIRROR="$APT_MIRROR" \
            PIP_INDEX_URL="$PIP_INDEX_URL" \
            PROXY_URL_DEFAULT="$PROXY_URL_DEFAULT" \
            bash scripts/build-image.sh 2>&1 | tee build-image.log

      - name: 上传构建日志(仅失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-image.log
          retention-days: 14
          if-no-files-found: ignore

      # 构建日志再推一份到 build-logs 分支: artifact 的**下载**接口要登录才能拉,
      # 而构建日志是排查问题最直接的材料, 不该卡在"要管理员权限"这一步。
      # 分支上的文件用 raw 链接就能免登录读到。
      - name: 推送构建日志到 build-logs 分支
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          cp build-image.log "logs/${GITHUB_RUN_ID}-${GITHUB_REF_NAME//\//_}.log" 2>/dev/null || true
          git add -A logs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "build log: run ${GITHUB_RUN_ID} (${GITHUB_REF_NAME})" || true
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/build-logs

      - name: 结构校验
        run: bash scripts/verify-image.sh --struct out/debian-usb-${{ env.SUITE }}.img

      - name: QEMU 启动冒烟测试
        continue-on-error: true
        run: bash scripts/verify-image.sh --boot out/debian-usb-${{ env.SUITE }}.img

      - name: 压缩产物
        run: |
          cd out
          # build 脚本是以 root 跑的, 产物属主是 root, 这里以 root 重建校验和文件
          sudo rm -f SHA256SUMS.txt
          # build-image.sh 已经压过一次, 这里只在缺失时补压, 避免重复压缩浪费时间
          if [ ! -f "debian-usb-${SUITE}.img.xz" ]; then
            sudo xz -T0 -6 -k -f "debian-usb-${SUITE}.img"
          fi
          sudo sh -c 'sha256sum ./*.img.xz > SHA256SUMS.txt'
          sudo chmod 0666 SHA256SUMS.txt
          ls -lh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: debian-usb-image-${{ env.SUITE }}
          path: |
            out/*.img.xz
            out/SHA256SUMS.txt
            out/BUILD-INFO.txt
          retention-days: 30
          if-no-files-found: error

      # 只有打 tag 才发 Release; workflow_dispatch 的试构建只在 Artifacts 里留一份,
      # 不去污染正式发布页。
      #
      # 注意: out/ 就在同一个 job 的 workspace 里, 上面的 upload-artifact 只是拷了一份,
      # 文件还在。曾经以为"上传完就得下载回来才能用", 加了 download-artifact 步骤,
      # 结果多转一道手: 第一次发 Release 时 Azure blob 下载重试 5 次全失败,
      # 整个 run 白白陪葬。现在直接用 workspace 里的 out/, 少搬 946MB,
      # 这种下载失败也就整个不存在了。
      - name: 生成 Release 说明
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "### ${GITHUB_REF_NAME} · Debian ${SUITE} · 档位 ${PROFILE}"
            echo
            echo "#### 镜像信息"
            echo
            echo '```'
            cat out/BUILD-INFO.txt
            echo '```'
            echo
            echo "#### 校验"
            echo
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
            echo
            echo "#### 写盘"
            echo
            echo "Windows 用 Rufus / balenaEtcher 选 \`$(basename out/*.img.xz)\`；Linux 直接 dd："
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS.txt"
            echo "sudo dd if=$(basename out/*.img.xz) of=/dev/sdX bs=4M status=progress conv=fsync"
            echo '```'
            echo
            echo "#### 本次改动"
            echo
            if [ -f CHANGELOG.md ]; then
              # 只取 CHANGELOG 里当前版本那一节, 别把整个历史都塞进说明里。
              # 标题写成 "## v1.0.0 - 2026-10-23" 或 "## v1.0.0" 都认。
              awk -v v="## ${GITHUB_REF_NAME}" '
                index($0, v) == 1 { grab = 1; next }
                grab && /^## / { exit }
                grab { print }
              ' CHANGELOG.md
            fi
          } > release-notes.md
          cat release-notes.md

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 同名 tag 被重复推送时(重跑 workflow)不要报错, 删掉旧的 release 重建
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在, 先删掉旧的"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --title "${TAG} · Debian ${SUITE} · 档位 ${PROFILE}" \
            --notes-file release-notes.md \
            --latest \
            out/*.img.xz out/SHA256SUMS.txt out/BUILD-INFO.txt
          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease \
            --jq '"发布完成: \(.tagName) (draft=\(.isDraft) prerelease=\(.isPrerelease))\n\(.url)"'

      - name: 构建摘要
        run: |
          {
            echo "### 镜像构建完成 ✅"
            echo
            echo '```'
            cat out/BUILD-INFO.txt
            echo '```'
            echo
            echo "产物: \`debian-usb-${{ env.SUITE }}.img.xz\`"
            echo
            echo "写盘(在 Windows 上推荐 Rufus / balenaEtcher, Linux 下可直接 dd):"
            echo '```bash'
            echo "sudo dd if=debian-usb-${{ env.SUITE }}.img.xz of=/dev/sdX bs=4M status=progress conv=fsync"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
