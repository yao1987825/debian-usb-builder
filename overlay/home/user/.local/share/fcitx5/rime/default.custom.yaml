# Rime 默认方案(".default")的配置补丁
#
# 这个文件只放**给 ".default" 方案**的设置 —— 目前只有 schema_list。
#
# 为什么不把 Shift 切换、候选词数量这些放这里
# ============================================
#
# Rime 启动时先加载 ".default" 方案(编译后的 build/default.yaml),
# 然后由 Switcher 按 schema_list 切到**真正在用的方案**(本镜像是 luna_pinyin_simp);
# 切换之后, 引擎读的是切换后的那个方案的配置。
# 也就是说: 写在 default.custom.yaml 里的功能性补丁, 全部留在没人用的
# ".default" 方案里, 一个都不会生效。
#
# 真机实测(2026-11-02): Shift 切中英文、候选词数量曾经全都写在下面这个文件里,
# 构建期的断言查的也是这个文件 —— 断言一直过, 真机上按 Shift 没反应。
# 功能性配置现在统一放在 **luna_pinyin_simp.custom.yaml**(同目录),
# 那里有一份详细的说明, 改配置请改那一份。
#
# 位置很关键: fcitx5-rime 的"用户目录"是 ~/.local/share/fcitx5/rime/,
# 放在 ~/.config/fcitx5/rime/ 下 Rime 根本不看 —— 踩过这个坑:
# 配置写了很久从没生效过, 表现就是"按 Shift 没反应"。
# 改完要重新部署(删 build 目录或重启 fcitx5), 否则还是旧方案。

patch:
  # 只留简体方案: 默认是繁体 luna_pinyin(真机 v1.0.4: 用户打出繁体字),
  # 镜像里的简繁转换也只对这一套方案生效。
  #
  # schema_list 必须留在这个文件里 —— Switcher 是拿 ".default" 方案的配置
  # 来读它, 并据此决定切到哪个方案。删了这里就没有活动方案了。
  "schema_list":
    - schema: luna_pinyin_simp
