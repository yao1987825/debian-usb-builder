# tmux 配置(由 debian-usb-builder 预置)
#
# 说明: 默认**不开** tmux —— 日常用 xfce4-terminal 的标签页就够了。
# 这个文件是给你进阶用的: 想开的时候直接敲 tmux, 标签页会多出一层
# (状态栏常驻显示所有标签页 + 快捷键提示), 适合跑长任务。
#
# 前缀键 Ctrl+b, 和 vim 习惯一致。

# ---- 前缀键 ----
set -g prefix C-b
unbind C-b
bind C-b send-prefix

# ---- 标签页(窗口)编号从 1 开始, 关掉后自动补位 ----
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 关掉最后一个窗口时 tmux 会退出回到普通 shell —— 不会出现"空白的 tmux"
set -g exit-empty on

# ---- 状态栏: 常驻显示所有标签页, 右侧直接写快捷键 ----
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=#1c1c1c,fg=#d0d0d0"
set -g status-left-length 40
set -g status-left "#[fg=#87af87] SESSION:#{session_name} #[default]"
set -g status-right-length 160
set -g status-right "#[fg=#6c6c6c] Ctrl+b → c 新标签 · n/p 切换 · 数字 直达 · x 关闭 · d 脱离 · ? 帮助 #[default]"
set -g window-status-format " #I:#W#{?window_zoomed_flag,Z,} "
set -g window-status-current-format "#[fg=#000000,bg=#87af87] #I:#W#[default]"

# 窗口名跟着当前目录走
setw -g automatic-rename on

# 鼠标: 直接点状态栏切标签页
set -g mouse on

# ---- 常用键位 ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind 1-9 select-window -t :{1-9}
bind x confirm-before -p "关闭这个标签页? (y/n) " kill-window
bind d detach-client
bind r source-file ~/.tmux.conf \; display-message "tmux 配置已重载"
bind s choose-tree -Zs

# 复制模式用 vi 键位
set -g mode-keys vi
bind Space send-prefix
