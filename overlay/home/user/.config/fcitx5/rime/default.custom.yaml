# Rime 全局配置补丁: 简体拼音 + 界面习惯
#
# 需要覆盖默认值时, 在这个文件里写 "patch" 即可, 不要直接改 default.yaml
# (升级 Rime 后会被覆盖)。
#

patch:
  # 候选词数量
  "menu/page_size": 7
  # 上屏第一个候选
  "switcher/select_first": true

  # ---- 左/右 Shift 切换中英文 ----
  # 注意这里的写法: 必须是 **扁平化** 的 "路径/键名": 值, 一层一层往下写。
  # 之前这里写成了 "ascii_composer/switch_key": "Shift_L" —— 那是给 switch_key
  # 这个键赋了一个字符串, 不是 Rime 要的 键 -> 动作 映射, 所以 Shift 永远没反应。
  # 动作选 commit_code(切换中西文状态); 不要用 inline_ascii, 那个是临时西文
  # 模式, 必须回车才确认, 不适合快速切换。
  "ascii_composer/switch_key/Shift_L": commit_code
  "ascii_composer/switch_key/Shift_R": commit_code
  # Control 不参与切换, 免得 Ctrl+字母被误吞
  "ascii_composer/switch_key/Control_L": noop
  "ascii_composer/switch_key/Control_R": noop

  # ascii_mode 开关显示在 F4 方案菜单里, reset: 0 = 每次启动都是中文
  "switches/@0/reset": 0

  # 默认使用简体中文方案
  "schema_list":
    - schema: luna_pinyin_simp